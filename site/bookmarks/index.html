  <script>
    // Bookmark data, grouped. Each group renders as its own rail-accented section.
    // Titles drop the group prefix the source Firefox names carry; the section
    // header supplies that context. Tags are retained on each link as the
    // grouping metadata (a future filter can use them).
    // Groups nest under a vendor so the renderer can drop a labeled divider
    // between vendors, not just a rail color per topic group.
    const VENDORS = [
      {
        vendor: "Anthropic",
        groups: [
          {
            group: "Claude",
            links: [
              { title: "Claude", url: "https://claude.ai", tags: ["Claude"] },
              { title: "Cookbook", url: "https://platform.claude.com/cookbook", tags: ["Claude"] },

              { title: "Recent Chats", url: "https://claude.ai/recents", tags: ["Claude"] },
              { title: "Status", url: "https://status.claude.com", tags: ["Claude", "Status Page"] },
              { title: "Usage", url: "https://claude.ai/settings/usage", tags: ["Claude"] },
            ],
          },
          {
            group: "Claude Code",
            links: [
              { title: "Claude Code", url: "https://claude.ai/code", tags: ["Claude Code"] },
              { title: "Artifacts", url: "https://claude.ai/code/artifacts", tags: ["Claude Code"] },
              { title: "Routines", url: "https://claude.ai/code/routines", tags: ["Claude Code"] },
            ],
          },
          {
            group: "Claude Code - Docs",
            links: [
              { title: "Artifacts", url: "https://code.claude.com/docs/en/artifacts", tags: ["Claude Code - Docs"] },
              { title: "Auto Mode", url: "https://code.claude.com/docs/en/auto-mode-config", tags: ["Claude Code - Docs"] },
              { title: "CHANGELOG", url: "https://code.claude.com/docs/en/changelog", tags: ["Claude Code - Docs"] },
              { title: "Debug Your Config", url: "https://code.claude.com/docs/en/debug-your-config", tags: ["Claude Code - Docs"] },
              { title: "Env Vars", url: "https://code.claude.com/docs/en/env-vars", tags: ["Claude Code - Docs"] },
              { title: "Hooks", url: "https://code.claude.com/docs/en/hooks", tags: ["Claude Code - Docs"] },
              { title: "MCP", url: "https://code.claude.com/docs/en/mcp", tags: ["Claude Code - Docs"] },
              { title: "Memory", url: "https://code.claude.com/docs/en/memory", tags: ["Claude Code - Docs"] },
              { title: "Output Styles", url: "https://code.claude.com/docs/en/output-styles", tags: ["Claude Code - Docs"] },
              { title: "Permissions", url: "https://code.claude.com/docs/en/permissions", tags: ["Claude Code - Docs"] },
              { title: "Plugin Marketplaces", url: "https://code.claude.com/docs/en/plugin-marketplaces", tags: ["Claude Code - Docs"] },
              { title: "Routines", url: "https://code.claude.com/docs/en/routines", tags: ["Claude Code - Docs"] },
              { title: "Settings", url: "https://code.claude.com/docs/en/settings", tags: ["Claude Code - Docs"] },
              { title: "Settings Reference", url: "https://code.claude.com/docs/en/settings-reference", tags: ["Claude Code - Docs"] },
              { title: "Skills", url: "https://code.claude.com/docs/en/skills", tags: ["Claude Code - Docs"] },
              { title: "Status Line", url: "https://code.claude.com/docs/en/statusline", tags: ["Claude Code - Docs"] },
              { title: "Subagents", url: "https://code.claude.com/docs/en/sub-agents", tags: ["Claude Code - Docs"] },
              { title: "The .claude Directory", url: "https://code.claude.com/docs/en/claude-directory", tags: ["Claude Code - Docs"] },
            ],
          },
          {
            group: "Claude Models",
            links: [
              { title: "Models", url: "https://platform.claude.com/docs/en/models/overview", tags: ["Claude Models"] },
              { title: "Fable 5.1 Model", url: "https://platform.claude.com/docs/en/models/fable-5-1/overview", tags: ["Claude Models"] },
              { title: "Opus 5.5 Model", url: "https://platform.claude.com/docs/en/models/opus-5-5/overview", tags: ["Claude Models"] },
              { title: "Sonnet 5 Model", url: "https://platform.claude.com/docs/en/models/sonnet-5/overview", tags: ["Claude Models"] },
              { title: "Haiku 4.5 Model", url: "https://platform.claude.com/docs/en/models/haiku-4-5/overview", tags: ["Claude Models"] },
            ],
          },
          {
            group: "Claude Platform Docs",
            links: [
              { title: "Effort", url: "https://platform.claude.com/docs/en/build-with-claude/effort", tags: ["Claude Platform Docs"] },
            ],
          },
        ],
      },
      {
        vendor: "OpenAI",
        groups: [
          {
            group: "Codex",
            links: [
              { title: "ChatGPT", url: "https://chatgpt.com", tags: ["Codex"] },
              { title: "Scheduled Tasks", url: "https://chatgpt.com/scheduled", tags: ["Codex"] },
              { title: "Usage", url: "https://chatgpt.com/codex/cloud/settings/analytics#usage", tags: ["Codex"] },
              { title: "Status", url: "https://status.openai.com", tags: ["Codex", "Status Page"] },
            ],
          },
          {
            group: "Codex Docs",
            links: [
              { title: "Changelog", url: "https://learn.chatgpt.com/docs/changelog?type=codex-cli", tags: ["Codex Docs"] },
              { title: "Configuration", url: "https://learn.chatgpt.com/docs/config-file/config-reference", tags: ["Codex Docs"] },
              { title: "Configuration - Config Sample", url: "https://learn.chatgpt.com/docs/config-file/config-sample", tags: ["Codex Docs"] },
              { title: "MCP", url: "https://learn.chatgpt.com/docs/extend/mcp", tags: ["Codex Docs"] },
            ],
          },
          {
            group: "OpenAI Platform Docs",
            links: [
              { title: "OpenAI Models", url: "https://developers.openai.com/api/docs/models", tags: ["OpenAI Platform Docs"] },
              { title: "GPT-6 Astra Model", url: "https://developers.openai.com/api/docs/models/gpt-6-astra", tags: ["OpenAI Platform Docs"] },
              { title: "GPT-6 Sol Model", url: "https://developers.openai.com/api/docs/models/gpt-6-sol", tags: ["OpenAI Platform Docs"] },
              { title: "GPT-6 Luna Model", url: "https://developers.openai.com/api/docs/models/gpt-6-luna", tags: ["OpenAI Platform Docs"] },
              { title: "GPT-5.4 mini Model", url: "https://developers.openai.com/api/docs/models/gpt-5.4-mini", tags: ["OpenAI Platform Docs"] },
              { title: "Daybreak Blue Model", url: "https://developers.openai.com/api/docs/models/gpt-daybreak-blue-latest", tags: ["OpenAI Platform Docs"] },
              { title: "gpt-oss-120b Model", url: "https://developers.openai.com/api/docs/models/gpt-oss-120b", tags: ["OpenAI Platform Docs"] },
            ],
          },
        ],
      },
      {
        vendor: "Google",
        groups: [
          {
            group: "Gemini",
            links: [
              { title: "Gemini", url: "https://gemini.google.com/app", tags: ["Gemini"] },
              { title: "Usage", url: "https://gemini.google.com/usage", tags: ["Gemini"] },
            ],
          },
          {
            group: "Gemini API Docs",
            links: [
              { title: "Gemini Models", url: "https://ai.google.dev/gemini-api/docs/models", tags: ["Gemini API Docs"] },
              { title: "Gemini 3.8 Flash Model", url: "https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash", tags: ["Gemini API Docs"] },
              { title: "Gemini 3.7 Flash Model", url: "https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash", tags: ["Gemini API Docs"] },
              { title: "Gemini 3.1 Pro Model", url: "https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview", tags: ["Gemini API Docs"] },
            ],
          },
          {
            group: "Antigravity",
            links: [
              { title: "Changelog", url: "https://antigravity.google/changelog", tags: ["Antigravity"] },
            ],
          },
          {
            group: "Antigravity Docs",
            links: [
              { title: "Status Line Customization", url: "https://antigravity.google/docs/cli/statusline", tags: ["Antigravity Docs"] },
            ],
          },
        ],
      },
    ];

    // Per-group rail accent, drawn from the shared forge palette in anvil-core.css.
    // Known groups are mapped intentionally; a new group gets a stable palette
    // pick so its rail is still colored without a config change.
    const GROUP_ACCENTS = {
      "Claude": "var(--sl-blue)",
      "Claude Code": "var(--sl-green)",
      "Claude Code - Docs": "var(--sl-cyan)",
      "Claude Models": "var(--sl-red)",
      "Claude Platform Docs": "var(--sl-yellow)",
    };
    const ACCENT_PALETTE = [
      "var(--sl-blue)", "var(--sl-green)", "var(--sl-cyan)",
      "var(--sl-yellow)", "var(--sl-red)", "var(--ember)",
    ];
    function groupAccent(group) {
      if (GROUP_ACCENTS[group]) return GROUP_ACCENTS[group];
      let hash = 0;
      for (let i = 0; i < group.length; i++) hash = (hash * 31 + group.charCodeAt(i)) >>> 0;
      return ACCENT_PALETTE[hash % ACCENT_PALETTE.length];
    }

    // Vendor colors are brand identity, not decoration, so they're an
    // explicit lookup rather than groupAccent()'s hash fallback. Same
    // --rail-* tokens (anvil-core.css) forge/balancing-the-anvil/ uses, so
    // "Anthropic" and "OpenAI" mean the same color on both pages.
    const VENDOR_ACCENTS = {
      "Anthropic": "var(--rail-anthropic)",
      "OpenAI": "var(--rail-openai)",
      "Google": "var(--rail-google)",
    };

    // Render a labeled divider per vendor, then one rail-accented section per
    // group: colored left rail + uppercase header, then compact rows of
    // name / dotted leader / shortened URL. Static.
    const root = document.getElementById("bookmarks");

    VENDORS.forEach((vendorBlock) => {
      const vendorHeading = document.createElement("h2");
      vendorHeading.className = "bm-vendor";
      vendorHeading.style.setProperty("--rail", VENDOR_ACCENTS[vendorBlock.vendor] || "var(--ember)");
      // Stable fragment id so anvil-anchors.js can hang a permalink on it.
      vendorHeading.id = vendorBlock.vendor.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      vendorHeading.textContent = vendorBlock.vendor;
      root.appendChild(vendorHeading);

      for (const section of vendorBlock.groups) {
        const group = document.createElement("section");
        group.className = "bm-group";
        group.style.setProperty("--rail", groupAccent(section.group));

        const title = document.createElement("h3");
        title.className = "bm-group-title";
        // Stable fragment id so anvil-anchors.js can hang a permalink on it.
        title.id = section.group.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        title.textContent = section.group;
        group.appendChild(title);

        const list = document.createElement("ul");
        list.className = "bm-list";

        for (const link of section.links) {
          const li = document.createElement("li");

          // The row itself is the anchor, so the name, the leader, and the
          // visible URL are all one click target rather than the name alone.
          const row = document.createElement("a");
          row.className = "bm-row";
          row.href = link.url;
          row.target = "_blank";          // always open bookmarks in a new tab
          row.rel = "noopener noreferrer";

          const name = document.createElement("span");
          name.className = "bm-name";
          name.textContent = link.title;
          row.appendChild(name);

          const leader = document.createElement("span");
          leader.className = "bm-leader";
          leader.setAttribute("aria-hidden", "true");
          row.appendChild(leader);

          const url = document.createElement("span");
          url.className = "bm-url";
          url.textContent = link.url.replace(/^https?:\/\//, "");
          url.title = link.url;           // the displayed URL is shortened and can ellipsis
          row.appendChild(url);

          li.appendChild(row);
          list.appendChild(li);
        }

        group.appendChild(list);
        root.appendChild(group);
      }
    });
  </script>
</body>
